<section class="section">
  {{runChecksHeader}}
  <div class="runChecksRow">
    <label class="runChecksOption" for="runChecksModeNone">
      <input id="runChecksModeNone" name="runChecksMode" type="radio" value="none" {{runChecksModeNoneChecked}} />
      <span>None</span>
    </label>
    <label class="runChecksOption" for="runChecksModeCompileOnly">
      <input id="runChecksModeCompileOnly" name="runChecksMode" type="radio" value="compile-only" {{runChecksModeCompileOnlyChecked}} />
      <span>Compile Only</span>
    </label>
    <label class="runChecksOption" for="runChecksModeCheckOnly">
      <input id="runChecksModeCheckOnly" name="runChecksMode" type="radio" value="check-only" {{runChecksModeCheckOnlyChecked}} />
      <span>Check Only</span>
    </label>
    <select id="runChecksRoute" class="runChecksSelect" aria-label="Check-only route" {{runChecksRouteDisabledAttr}}>
      <option value="native" {{runChecksRouteNativeSelected}}>Native</option>
      <option value="docker" {{runChecksRouteDockerSelected}}>Docker</option>
      <option value="ssh" {{runChecksRouteSshSelected}}>SSH</option>
    </select>
  </div>
  <div class="helperText">Use Compile Only or Check Only to override execution behavior for all runs from the sidebar.</div>
  <span id="runChecksStatus" class="status {{runChecksStatusClassName}}">{{runChecksStatusText}}</span>
</section>
