<section class="section">
  {{reportGenerationHeader}}
  <div class="smokeMarkdownRow">
    <label class="smokeMarkdownLabel" for="smokeMarkdownEnabled">
      <input
        id="smokeMarkdownEnabled"
        type="checkbox"
        aria-label="Enable report generation"
        {{smokeMarkdownEnabledChecked}}
      />
    </label>
    <input
      id="smokeMarkdownPath"
      class="argsInput"
      type="text"
      placeholder="Optional report path"
      value="{{smokeMarkdownPathValue}}"
      {{smokeMarkdownPathDisabledAttr}}
    />
  </div>
  <div class="helperText">Enable markdown output and optionally override the generated report path.</div>
  <span id="reportGenerationStatus" class="status {{reportStatusClassName}}">{{reportStatusText}}</span>
</section>
