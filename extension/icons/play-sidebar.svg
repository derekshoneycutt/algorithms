<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <style>
    * { stroke-linecap: round; stroke-linejoin: round; shape-rendering: geometricPrecision; }
  </style>
  
  <!-- LAYER 1: Classic Cartoonish Play Button (Background) - straight edges with super curved corners, low opacity -->
  <path d="M7 5 L17 11.5 Q19 12 17.5 13.5 L7.5 18.5 Q5.5 19 5.5 17 L6 7 Q5.5 4.5 7 5 Z" 
    fill="currentColor" stroke="currentColor" stroke-width="3.5" opacity="0.38" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- LAYER 2: Decision Tree (Foreground, large, fills space) - sharp, high contrast -->
  
  <!-- Circle: top decision node, positioned high to frame the space -->
  <circle cx="12" cy="3.5" r="2.2" 
    fill="none" stroke="currentColor" stroke-width="1" opacity="0.95" />
  
  <!-- Left connector: circle to diamond, longer angled line down-left -->
  <line x1="10.8" y1="5.2" x2="5.5" y2="13.5" 
    stroke="currentColor" stroke-width="0.7" opacity="0.92" />
  
  <!-- Right connector: circle to square, longer angled line down-right -->
  <line x1="13.2" y1="5.2" x2="18.5" y2="13.5" 
    stroke="currentColor" stroke-width="0.7" opacity="0.92" />
  
  <!-- Diamond on left: larger, centered around (5.5, 15.5) -->
  <path d="M5.5 12.5 L2.8 15.5 L5.5 18.5 L8.2 15.5 Z" 
    fill="none" stroke="currentColor" stroke-width="1" opacity="0.95" />
  
  <!-- Square on right: larger, positioned symmetrically at (18.5, 15.5) -->
  <rect x="16.2" y="13.5" width="4.6" height="4" 
    fill="none" stroke="currentColor" stroke-width="1" opacity="0.95" />
</svg>
