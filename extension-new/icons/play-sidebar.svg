<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    * { stroke-linecap: round; stroke-linejoin: round; shape-rendering: geometricPrecision; }
  </style>

  <g transform="translate(12 11.6) scale(0.92) translate(-12 -12)">

  <!-- LAYER 1: Play triangle tuned to align with enlarged foreground anchor centers -->
  <!--<path d="M8.9 4.7 L18.9 12 Q19.5 12.4 18.9 13 L9.2 19.5 Q8 20.5 7.9 18.9 L8.1 5.8 Q8 4.8 8.9 4.7 Z"
    fill="#818CF8" stroke="#818CF8" stroke-width="2.8" opacity="0.34" />-->

  <!-- LAYER 2: Prevalent foreground shapes centered on nearest triangle anchors -->

  <!-- Two connectors only: circle to diamond and circle to square. -->
  <line x1="9.0" y1="8.8" x2="8.05" y2="16.05"
    stroke="#818CF8" stroke-width="1.5" opacity="1" />
  <line x1="11.9" y1="7.1" x2="17.45" y2="11.7"
    stroke="#818CF8" stroke-width="1.5" opacity="1" />

  <!-- Larger top circle centered on top triangle anchor. -->
  <circle cx="8.5" cy="4.8" r="4.2"
    fill="none" stroke="#F2B880" stroke-width="1.7" opacity="1" />

  <!-- Bottom diamond scaled to match circle size. -->
  <path d="M8.05 16.05 L3.85 20.25 L8.05 24.45 L12.25 20.25 Z"
    fill="none" stroke="#F2B880" stroke-width="1.7" opacity="1" />

  <!-- Larger right square centered on right triangle anchor. -->
  <rect x="17.45" y="9.9" width="5.0" height="5.0"
    fill="none" stroke="#F2B880" stroke-width="1.7" opacity="1" />

  </g>
</svg>
