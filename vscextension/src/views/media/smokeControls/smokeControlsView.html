<html lang="en">
  <head>

    <meta

    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{{STYLE_URI}}}" />
    <title>{{{TITLE}}}</title>

  <body>
    <main class="smoke-controls-shell" data-role="smoke-controls-shell">
      <header class="smoke-controls-header">

      </header>
      <section class="smoke-controls-content" aria-label="Smoke controls content">
        <div data-role="smoke-controls-app"></div>
      </section>
    </main>
    <script nonce="{{{NONCE}}}" src="{{{SCRIPT_URI}}}"></script>
  </body>
</html>
